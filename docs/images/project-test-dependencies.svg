    <rect x="475" y="208" width="460" height="40" rx="3"/>
    <rect x="475" y="264" width="460" height="40" rx="3"/>
  </g>
  <g class="edge">
    <line data-source="Graphs.Tests" data-target="Graphs.Core" x1="285" y1="116" x2="473" y2="116"/>
    <line data-source="Graphs.Tests" data-target="Graphs" x1="285" y1="172" x2="473" y2="172"/>
    <line data-source="Graphs.Tests" data-target="Graphs.Logical" x1="285" y1="228" x2="473" y2="228"/>
    <line data-source="Graphs.Tests" data-target="Graphs.Execution" x1="285" y1="284" x2="473" y2="284"/>
  </g>
  <g class="node">
