<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1270" viewBox="0 0 1000 1270" role="img" aria-labelledby="title description">
  <title id="title">完整测试项目依赖图</title>
  <desc id="description">三个测试项目共十九条直接项目引用。每条引用均为一条水平直线和一个箭头，无折点。相同名称表示相同项目。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .heading { font-size: 22px; font-weight: 600; }
      .category { font-size: 16px; font-weight: 600; }
      .node { font-size: 18px; text-anchor: middle; dominant-baseline: central; }
      .source { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 1.5; }
      .target { fill: white; stroke: #64748b; stroke-width: 1.3; }
      .edge { stroke: #475569; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1000" height="1270" fill="white"/>
  <text x="35" y="33" class="heading">测试项目</text>
  <text x="475" y="33" class="heading">直接引用的项目</text>

  <rect x="450" y="55" width="515" height="270" rx="5" fill="#e3f2fd"/>
