  <rect x="450" y="350" width="515" height="100" rx="5" fill="#e8f5e9"/>
  <text x="475" y="375" class="category">文件格式</text>
  <rect x="35" y="390" width="250" height="40" rx="5" class="source"/>
  <text x="160" y="410" class="node">Gguf.Tests</text>
