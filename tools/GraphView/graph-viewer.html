<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharpInference XML 图查看器</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#0d1421;color:#e5edf8}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column}
header{padding:16px 20px;background:#151f30;border-bottom:1px solid #2b3b52}
.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.languages{display:flex;gap:6px;flex-shrink:0}
.languages button[aria-pressed=true]{background:#224f86;border-color:#7098e4}
h1{font-size:18px;margin:0 0 12px;flex:1}h1 .offline{font-size:12px;font-weight:400;color:#a2b3ca;margin-left:12px}
#graph-kind{font-size:12px;font-weight:400;margin-left:10px;background:#224f86}#graph-kind[hidden]{display:none}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,.file,select,input[type=search]{font:inherit;font-size:13px;border:1px solid #435571;border-radius:6px;background:#233149;color:#e5edf8;padding:7px 10px}
button,.file{cursor:pointer}button:hover,.file:hover{background:#324868}button:disabled{opacity:.4;cursor:default}
.file{background:#224f86}input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
select{max-width:320px}input[type=search]{width:190px}label{font-size:13px}
#status{margin-top:10px;font-size:12px;color:#a2b3ca;overflow-wrap:anywhere}
#status.error{color:#ffb4a9}
main{display:flex;flex:1;min-height:0}
#viewport{flex:1;position:relative;min-width:0;background:#0d1421;overflow:hidden}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg.dragging{cursor:grabbing}
aside{width:340px;flex-shrink:0;overflow:auto;background:#151f30;border-left:1px solid #2b3b52;padding:18px;font-size:13px;line-height:1.6}
h2{font-size:15px;margin:0 0 12px}h3{font-size:13px;color:#a6c8fa;margin:18px 0 6px}
p{margin:8px 0}code{overflow-wrap:anywhere;color:#b6d3ff}
.hint{color:#9bacc4;font-size:12px}.badge{display:inline-block;padding:2px 8px;border-radius:4px;background:#293b56;margin:2px}
table{width:100%;border-collapse:collapse;font-size:12px}td{border-bottom:1px solid #30415a;padding:6px 0;vertical-align:top;overflow-wrap:anywhere}td:first-child{width:38%;color:#9bacc4;padding-right:8px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:#bccce0}
.formula{font-size:13px;line-height:1.7}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:25px}
#empty div{max-width:470px}#empty strong{font-size:22px}#empty p{color:#9bacc4;line-height:1.8}
#legend{position:absolute;bottom:12px;left:14px;display:flex;gap:12px;font-size:11px;color:#a2b3ca;pointer-events:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.edge{fill:none;stroke:#486384;stroke-width:1.2}
.edge-link{cursor:pointer;outline:none}.edge-hit{fill:none;stroke:transparent;stroke-width:12;vector-effect:non-scaling-stroke;pointer-events:stroke}
.edge-link:hover .edge:not(.active),.edge-link:focus .edge:not(.active){stroke:#bdd5f5;stroke-width:2}
.edge.state{stroke:#bd93e0;stroke-dasharray:5 4}
.edge.skip{stroke:#60c9ba}
.edge.residual{stroke:#60c9ba}
.edge.active{stroke:#ffcd70;stroke-width:2.4;vector-effect:non-scaling-stroke;marker-end:url(#arrow-active)}
.node{cursor:grab;outline:none}.node.dragging{cursor:grabbing}.node rect{stroke:#56728e;stroke-width:1.2;fill:#22364f}
.node.call rect,.node.region rect{fill:#23385d;stroke:#7098e4}.node.external rect{fill:#233e39;stroke:#62a48f}
.node.kernel rect{fill:#40315b;stroke:#be91e5}.node.barrier rect{fill:#493b25;stroke:#d3b071}
.node text{fill:#e5edf8;font-size:14px;pointer-events:none}.node .subtitle{fill:#abc0d9;font-size:12px}
.node.match rect{stroke:#e0aaff;stroke-width:2.4}.node.selected rect{stroke:#ffcd70;stroke-width:3}
.node:not(.selected):hover rect,.node:not(.selected):focus rect{stroke:#fff}
.node .port rect{fill:#173d50;stroke:#78bfd6;stroke-width:1}
.node .port.out rect{fill:#254536;stroke:#80c9a3}
.node .port text{font-size:11px;fill:#e5edf8;text-anchor:middle}
.node .port{cursor:help}.node .port.active rect{fill:#705526;stroke:#ffcd70;stroke-width:2}
.node .port.hidden-source rect{stroke:#c6a572;stroke-dasharray:3 2;fill:#413629}
.node .port .source-note{font-size:9px;fill:#d8bc90}
@media(max-width:760px){aside{width:260px}header{padding:12px}h1 .offline{display:none}}
@media(max-width:540px){main{flex-direction:column}aside{width:100%;height:180px;border-left:0;border-top:1px solid #2b3b52}#legend{display:none}}
</style>
</head>
<body>
<header>
  <div class="heading">
    <h1><span data-i18n="title">SharpInference XML 图查看器</span><span id="graph-kind" class="badge" hidden aria-live="polite"></span><span class="offline" data-i18n="offline">单文件 · 离线 · 无依赖</span></h1>
    <nav class="languages" data-i18n-aria-label="languages" aria-label="界面语言">
      <button type="button" data-language="zh" lang="zh-CN" aria-pressed="true">中文</button>
      <button type="button" data-language="en" lang="en" aria-pressed="false">English</button>
    </nav>
  </div>
  <div class="tools">
    <label class="file" for="file" data-i18n="open">打开 XML 文件</label><input id="file" type="file" accept=".xml,text/xml,application/xml">
    <button id="back" data-i18n="back" data-i18n-title="backTitle" title="后退（Alt + ←）" disabled>← 后退</button>
    <button id="forward" data-i18n="forward" data-i18n-title="forwardTitle" title="前进（Alt + →）" disabled>前进 →</button>
    <span id="history" class="hint" aria-live="polite">0 / 0</span>
    <button id="home" data-i18n="home" disabled>主图</button>
    <button id="architecture" data-i18n="architecture" disabled>架构视图</button>
    <select id="scope" data-i18n-aria-label="scope" aria-label="图或层定义" disabled><option data-i18n="unopened">尚未打开文件</option></select>
    <label><span data-i18n="layoutPriority">布局优先级</span>
      <select id="layout-priority" data-i18n-aria-label="layoutPriority" aria-label="布局优先级" disabled>
        <option value="execution" data-i18n="executionPriority">执行顺序优先</option>
        <option value="logical" data-i18n="logicalPriority">逻辑优先</option>
      </select>
    </label>
    <label><input id="weights" type="checkbox"> <span data-i18n="weights">显示权重 / 常量</span></label>
    <label><input id="collapse" type="checkbox" disabled> <span data-i18n="collapse">折叠重复组</span></label>
    <label><input id="states" type="checkbox" disabled> <span data-i18n="states">跨步状态</span></label>
    <input id="search" type="search" data-i18n-placeholder="search" data-i18n-aria-label="searchLabel" placeholder="搜索节点 / 算子 / 资源" aria-label="搜索节点">
    <button id="next" data-i18n="next" disabled>下一个</button>
    <button id="fit" data-i18n="fit" disabled>适应画布</button>
    <button id="layout" data-i18n="layout" disabled>重置布局</button>
    <button id="readable" data-i18n="readable" data-i18n-title="readableTitle" title="可读视图（F）：恢复 100% 比例；选中节点时以它为中心" aria-keyshortcuts="F" disabled>可读视图 (F)</button>
    <button id="minus" data-i18n-aria-label="zoomOut" aria-label="缩小" disabled>−</button>
    <button id="plus" data-i18n-aria-label="zoomIn" aria-label="放大" disabled>+</button>
    <span id="zoom" class="hint">100%</span>
    <span id="readability" class="hint"></span>
  </div>
  <div id="status" role="status" aria-live="polite">请选择 SharpInference Graph XML。</div>
  <progress id="load-progress" data-i18n-aria-label="loadProgress" aria-label="加载进度" hidden></progress>
</header>
<main>
  <div id="viewport">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg" data-i18n-aria-label="canvas" aria-label="节点关系图">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7896bc"/></marker>
        <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#ffcd70"/></marker>
      </defs>
      <g id="world"><g id="edges"></g><g id="nodes"></g></g>
    </svg>
    <div id="empty"><div><strong data-i18n="emptyTitle">把模型结构变成可探索的节点图</strong><p data-i18n="emptyHelp">点击“打开 XML 文件”，也可将文件拖放到这里。</p><p data-i18n="privacy">文件仅在浏览器内读取，不会上传到任何服务器。</p></div></div>
    <div id="legend"><span><i class="dot" style="background:#7098e4"></i><span data-i18n="legendRegions">Definition / 图调用</span></span><span><i class="dot" style="background:#56728e"></i><span data-i18n="legendOperators">算子</span></span><span><i class="dot" style="background:#62a48f"></i><span data-i18n="legendResources">输入 / 状态 / 资源</span></span></div>
  </div>
  <aside id="details">
    <h2 data-i18n="helpTitle">使用说明</h2>
    <p data-i18n="helpNodes"></p>
    <p data-i18n="helpEdges"></p>
    <p data-i18n="helpRegions"></p>
    <p data-i18n="helpMetadata"></p>
    <p data-i18n="helpLayout"></p>
    <p data-i18n="helpReadable"></p>
    <p data-i18n="helpHistory"></p>
    <p data-i18n="helpWeights"></p>
    <p class="hint" data-i18n="helpOrder"></p>
  </aside>
</main>

    text(raw, "summary", t("rawXml"));
    text(raw, "pre", new XMLSerializer().serializeToString(state.plan?.originals.get(node.element) || node.element)); panel.append(raw);
  }
  function selectEdge(edge) {
    state.selected = null;
    state.selectedEdge = edge;
    for (const node of state.nodes)
      node.dom.classList.toggle("selected", node === edge.from || node === edge.to);
    for (const item of state.edges) item.dom.classList.toggle("active", item === edge);
    highlightPorts([edge]);
    const panel = $("details"); panel.replaceChildren();
    text(panel, "h2", t("edgeDetails"));
    for (const [label, node] of [[t("source"), edge.from], [t("target"), edge.to]]) {
      text(panel, "h3", label);
      const button = text(panel, "button", node.id);
      button.addEventListener("click", () => { select(node); focusNode(node); });
      text(panel, "p", node.label, "hint");
    }
    text(panel, "h3", t("edgeBindings", edge.bindings.length));
    for (const binding of edge.bindings) {
      text(panel, "p", `${binding.port} · ${binding.access}`, "badge");
      text(panel, "code", binding.resource);
      const resource = state.resources.get(binding.resource);
      if (resource) text(panel, "p", tensor(resource), "hint");
    }
  }
  function enter(node) {
    if (!node.drillTarget && !node.definition) return;
    navigate(node.drillTarget || node.definition);
  }
  function highlightPorts(edges) {
    const ports = new Set(edges.flatMap(edge => [edge.inputPort, edge.outputPort]));
    for (const node of state.nodes)
      for (const port of node.ports) port.dom.classList.toggle("active", ports.has(port));
  }
  function transform() {
    $("world").setAttribute("transform", `translate(${state.x},${state.y}) scale(${state.scale})`);
    $("zoom").textContent = `${state.scale < .01 ? (state.scale * 100).toFixed(2) : Math.round(state.scale * 100)}%`;
    $("readability").textContent = state.scale < .85 ? t("smallText") : "";
  }
  function readable(centerSelection = true) {
    const anchor = centerSelection ? state.selected || state.selectedEdge?.from : null;
    if (anchor) { focusNode(anchor); return; }
    const rect = $("canvas").getBoundingClientRect();
    state.scale = 1;
    state.x = Math.max(20, (rect.width - state.width) / 2) - (state.left || 0);
    state.y = Math.max(20, (rect.height - state.height) / 2) - (state.top || 0);
    transform();
  }
  function fit() {
    const rect = $("canvas").getBoundingClientRect();
    state.scale = Math.max(.0001, Math.min(1, (rect.width - 40) / state.width, (rect.height - 40) / state.height));
    state.x = (rect.width - state.width * state.scale) / 2 - (state.left || 0) * state.scale;
    state.y = (rect.height - state.height * state.scale) / 2 - (state.top || 0) * state.scale; transform();
  }
  function zoom(factor, x, y) {
    if (state.renderBusy) return;
    const next = Math.max(.0001, Math.min(3, state.scale * factor));
    state.x = x - (x - state.x) * next / state.scale;
    state.y = y - (y - state.y) * next / state.scale;
    state.scale = next; transform();
  }
  function focusNode(node) {
    const rect = $("canvas").getBoundingClientRect();
    state.scale = 1; state.x = rect.width / 2 - node.x - node.width / 2; state.y = rect.height / 2 - node.y - node.height / 2;
    transform();
  }
  function updateSearch(focus = true) {
    const query = $("search").value.trim().toLocaleLowerCase();
    state.matches = query ? state.nodes.filter(node => `${node.id} ${node.displayName || ""} ${node.label} ${node.path || ""} ${node.bindings.map(b => `${b.port} ${b.resource}`).join(" ")}`.toLocaleLowerCase().includes(query)) : [];
    for (const node of state.nodes) node.dom.classList.toggle("match", state.matches.includes(node));
    setRenderControlDisabled("next", !state.matches.length);
    $("next").textContent = query ? t("nextCount", state.matches.length) : t("next");
    state.matchIndex = -1;
    if (focus && state.matches.length) nextMatch();
  }
  function nextMatch() {
    if (!state.matches.length) return;
    state.matchIndex = (state.matchIndex + 1) % state.matches.length;
    const node = state.matches[state.matchIndex]; select(node); focusNode(node);
  }
  $("file").addEventListener("change", event => openFile(event.target.files[0]));
  $("scope").addEventListener("change", () => navigate($("scope").value));
  $("home").addEventListener("click", () => navigate("root"));
  $("architecture").addEventListener("click", () => navigate(state.architectureKey));
  $("back").addEventListener("click", () => travel(-1));
  $("forward").addEventListener("click", () => travel(1));
  document.addEventListener("keydown", event => {
    if (!event.isComposing && !event.altKey && !event.ctrlKey && !event.metaKey &&
        event.key.toLowerCase() === "f" && !$("readable").disabled && event.target instanceof Element &&
        !event.target.closest("input, textarea, select") && !event.target.isContentEditable) {
      event.preventDefault(); readable();
    }
    if (state.root && event.altKey && !event.ctrlKey && !event.metaKey &&
        (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
      event.preventDefault(); travel(event.key === "ArrowLeft" ? -1 : 1);
    }
  });
  function redrawOptions() {
    if (state.renderBusy) return;
    const view = captureView(), rect = $("canvas").getBoundingClientRect();
    const modeChanged = view.layoutPriority !== $("layout-priority").value;
    const centerX = (rect.width / 2 - state.x) / state.scale;
    const centerY = (rect.height / 2 - state.y) / state.scale;
    const distance = node => Math.hypot(node.x + node.width / 2 - centerX, node.y + node.height / 2 - centerY);
    const candidates = [...state.nodes].sort((a, b) => distance(a) - distance(b));
    const preferred = state.selected || state.selectedEdge?.from;
    if (preferred) candidates.unshift(preferred);
    const anchors = candidates.map(node => ({ key: node.key,
      x: state.x + (node.x + node.width / 2) * state.scale,
      y: state.y + (node.y + node.height / 2) * state.scale }));
    if (!render()) {
      if (modeChanged) {
        const failure = state.statusMessage;
        restoreView(view); status(failure, true);
      }
      return;
    }
    state.scale = view.scale; state.x = view.x; state.y = view.y;
    for (const anchor of anchors) {
      const node = state.nodes.find(item => item.key === anchor.key);
      if (!node) continue;
      state.x = anchor.x - (node.x + node.width / 2) * state.scale;
      state.y = anchor.y - (node.y + node.height / 2) * state.scale;
      break;
    }
    transform();
    const selected = state.nodes.find(node => node.key === view.selected);
    if (selected) select(selected);
    else if (view.selectedEdge) {
      const edge = state.edges.find(item => item.from.key === view.selectedEdge.from &&
        item.to.key === view.selectedEdge.to && item.role === view.selectedEdge.role &&
        item.bindings[0].resource === view.selectedEdge.resource && item.bindings[0].port === view.selectedEdge.port);
      if (edge) selectEdge(edge);
    }
    state.matchIndex = view.matchIndex;
    $("details").scrollTop = view.detailsScroll;
    if (modeChanged) {
      if (state.historyIndex >= 0) state.history[state.historyIndex] = view;
      state.history.splice(state.historyIndex + 1);
      state.history.push(captureView()); state.historyIndex = state.history.length - 1;
      updateNavigation();
    }
  }
  $("layout-priority").addEventListener("change", redrawOptions);
  $("collapse").addEventListener("change", redrawOptions);
  $("states").addEventListener("change", redrawOptions);
  $("weights").addEventListener("change", redrawOptions);
  $("fit").addEventListener("click", fit);
  $("layout").addEventListener("click", () => { state.positions.delete(state.layoutKey); render(); });
  $("readable").addEventListener("click", () => readable());
  $("search").addEventListener("input", () => updateSearch());
  $("search").addEventListener("keydown", event => { if (event.key === "Enter") nextMatch(); });
  $("next").addEventListener("click", nextMatch);
  for (const [id, factor] of [["plus", 1.25], ["minus", .8]]) $(id).addEventListener("click", () => {
    const rect = $("canvas").getBoundingClientRect(); zoom(factor, rect.width / 2, rect.height / 2);
  });
  $("canvas").addEventListener("wheel", event => {
    if (!state.root) return;
    event.preventDefault();
    const rect = $("canvas").getBoundingClientRect();
    zoom(Math.exp(-event.deltaY * .0015), event.clientX - rect.left, event.clientY - rect.top);
  }, { passive: false });
  let drag = null, suppressClick = false, routingFrame = null;
  function startNodeDrag(event, node) {
    if (event.button !== 0 || drag) return;
    event.stopPropagation();
    suppressClick = false;
    drag = { node, pointerId: event.pointerId, x: event.clientX, y: event.clientY,
      startX: node.x, startY: node.y, scale: state.scale, moved: false, status: state.statusMessage };
    node.dom.setPointerCapture(event.pointerId);
  }
  $("canvas").addEventListener("pointerdown", event => {
    if (event.button !== 0 || drag) return;
    suppressClick = false;
    drag = { pointerId: event.pointerId, x: event.clientX, y: event.clientY, startX: state.x, startY: state.y };
    if (!event.target.closest(".node, .edge-link")) {
      $("canvas").setPointerCapture(event.pointerId);
      $("canvas").classList.add("dragging");
    } else drag = null;
  });
  $("canvas").addEventListener("pointermove", event => {
    if (!drag || event.pointerId !== drag.pointerId) return;
    if (drag.node) {
      const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) < 4) return;
      drag.moved = true; suppressClick = true;
      const node = drag.node, x = drag.startX + dx / drag.scale, y = drag.startY + dy / drag.scale;
      if (state.nodes.some(other => other !== node &&
          x < other.x + other.width + 24 && x + node.width + 24 > other.x &&
          y < other.y + other.height + 36 && y + node.height + 36 > other.y)) {
        status(message("overlappingNodes"), true); return;
      }
      node.x = x; node.y = y; node.dom.classList.add("dragging");
      node.dom.setAttribute("transform", `translate(${x},${y})`);
      status(drag.status);
      const positions = state.positions.get(state.layoutKey) || new Map();
      positions.set(node.key, { x, y }); state.positions.set(state.layoutKey, positions);
      if (routingFrame === null) routingFrame = requestAnimationFrame(() => {
        routingFrame = null;
        try { routeEdges(); } catch (error) { status(message("drawingFailed", errorMessage(error)), true); }
      });
      return;
    }
    state.x = drag.startX + event.clientX - drag.x; state.y = drag.startY + event.clientY - drag.y; transform();
  });
  const stopDrag = event => {
    if (!drag || event.pointerId !== drag.pointerId) return;
    const target = drag.node?.dom || $("canvas");
    drag.node?.dom.classList.remove("dragging");
    const moved = drag.moved;
    drag = null; $("canvas").classList.remove("dragging");
    if (target.hasPointerCapture(event.pointerId)) target.releasePointerCapture(event.pointerId);
    if (moved) setTimeout(() => { suppressClick = false; }, 0);
  };
  $("canvas").addEventListener("pointerup", stopDrag);
  $("canvas").addEventListener("pointercancel", stopDrag);
  $("canvas").addEventListener("lostpointercapture", stopDrag);
  $("viewport").addEventListener("dragover", event => { event.preventDefault(); event.dataTransfer.dropEffect = "copy"; });
  $("viewport").addEventListener("drop", event => { event.preventDefault(); openFile(event.dataTransfer.files[0]); });
  for (const button of document.querySelectorAll("[data-language]"))
    button.addEventListener("click", () => setLanguage(button.dataset.language));
  localizeStatic();
  status(message("chooseFile"));

})();
</script>
</body>
</html>
